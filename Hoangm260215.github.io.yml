  silver:
    name: "VVIP"
    icon: "🥈"
    color: "#cbd5e1"
    cls: "silver"
  gold:
    name: "SSS-VIP"
    icon: "🥇"
    color: "#fbbf24"
    cls: "gold"

RANK_TITLES:
  bronze: ["VietNam-Event"]
  silver: ["VietNam-Reward", "VietNam-Event"]
  gold: ["Thanks-Vietnam", "VietNam-Reward", "VietNam-Event"]

RANK_CROWNS:
  bronze: "♛"
  silver: "♛♛"
  gold: "✦♛✦"

# ============================================================
# ============ CODE STORE POOLS =============================
# ============================================================
CODE_POOLS:
  bronze: "LINKG0-VIP-"
  silver: "LINKG0-VVIP-"
  gold: "LINKG0-SSS-VIP"

CODE_SUFFIXES:
  bronze: "-C0DE"
  silver: "-LGCODE"
  gold: "-LINKGO-CODE"

CODE_RANDOM_POOL: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
CODE_RANDOM_LENGTH: 35

# ============================================================
# ============ TOKEN CHARS ==================================
# ============================================================
TOKEN_CHARS: "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"

# ============================================================
# ============ MUSIC (Vietnamese Web Audio Pentatonic) ======
# ============================================================
VN_NOTES: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33]
VN_MELODY: [0, 2, 4, 2, 3, 4, 0, 2, 4, 5, 4, 2, 0, 2, 3, 2, 0]

# ============================================================
# ============ BUILD ========================================
# ============================================================
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      lang: "vi"

include:
  - "_pages"
  - ".htaccess"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor"
  - "README.md"
  - "LICENSE"
  - ".gitignore"
