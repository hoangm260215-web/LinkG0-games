# ============================================================
# ============ HTML HEAD ====================================
# ============================================================
html:
  lang: "vi"
  charset: "UTF-8"
  viewport: "width=device-width, initial-scale=1.0"
  title: "LinkGO v7.5 — Event Vietnam WOW 🇻🇳 | Kỷ niệm 1 Năm"
  csp: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.qrserver.com; media-src 'self' data: blob: https://cdn.pixabay.com https://*.pixabay.com; connect-src 'self' https://api.qrserver.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
  x_content_type_options: "nosniff"
  referrer_policy: "no-referrer"
  google_fonts_url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"

# ============================================================
# ============ CSS :root VARIABLES ==========================
# ============================================================
css_root:
  bg: "#050b1a"
  bg-2: "#0a1428"
  card: "#0d1a33"
  border: "#1a2f57"
  border-2: "#234078"
  primary: "#3b82f6"
  primary-2: "#06b6d4"
  accent: "#22d3ee"
  accent-2: "#a78bfa"
  accent-3: "#f472b6"
  gold: "#fbbf24"
  silver: "#cbd5e1"
  bronze: "#cd7f32"
  success: "#10b981"
  danger: "#ef4444"
  warn: "#f59e0b"
  text: "#e2e8f0"
  muted: "#7c93bb"
  glass: "rgba(13,26,51,.6)"
  radius: "20px"
  radius-sm: "12px"
  transition: ".28s cubic-bezier(.22,1,.36,1)"
  shadow-lg: "0 20px 60px rgba(0,0,0,.4)"

# ============================================================
# ============ JAVASCRIPT CONSTANTS =========================
# ============================================================
constants:
  VERSION: "v7.5"
  EVENT_START: "2026-10-01T00:00:00"
  EVENT_END: "2026-10-20T23:59:59"
  ADMIN_CODE: "LINKGO-TESTCODE-VN"
  LINKBUO_PER_CORRECT: 75
  CODE_EXPIRY_MS: 1814400000       # 3 * 7 * 24 * 60 * 60 * 1000
  SITE: "LinkGO-Vn"

# ============================================================
# ============ LOCALSTORAGE KEYS ============================
# ============================================================
localStorage_keys:
  LS_USER: "linkgo_user_v7"
  LS_LINKS: "linkgo_links_v7"
  LS_PROGRESS: "linkgo_progress_v7"
