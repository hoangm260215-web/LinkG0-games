  LS_REDEEMED: "linkgo_redeemed_v7"
  LS_QUIZ_PROGRESS: "linkgo_quiz_v7"
  LS_RANK: "linkgo_rank_v7"

# ============================================================
# ============ SECURITY =====================================
# ============================================================
SECURITY:
  MAX_URL_LENGTH: 2048
  MAX_NAME_LENGTH: 40
  MAX_AVATAR_BYTES: 524288          # 512 * 1024
  MAX_LINKS_PER_USER: 100
  MIN_PASSWORD_LENGTH: 8
  RATE_LIMIT_WINDOW: 60000
  RATE_LIMIT_MAX: 10
  ALLOWED_URL_SCHEMES: ["http:", "https:"]
  ALLOWED_IMAGE_TYPES: ["image/jpeg", "image/png", "image/webp", "image/gif"]
  TOKEN_LENGTH: 12
  PBKDF2_ITERATIONS: 250000
  NONCE_LENGTH: 16
  MIN_TASK_DURATION_MS: 800
  MIN_LINK_DURATION_MS: 3000
  PROGRESS_TTL_MS: 3600000
  TAMPER_LOCK_MS: 30000

