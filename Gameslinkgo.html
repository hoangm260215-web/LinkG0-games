<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.qrserver.com; media-src 'self' data: blob: https://cdn.pixabay.com https://*.pixabay.com; connect-src 'self' https://api.qrserver.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<title>LinkGO v7.5 — Event Vietnam WOW 🇻🇳 | Kỷ niệm 1 Năm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --bg:#050b1a;--bg-2:#0a1428;--card:#0d1a33;
  --border:#1a2f57;--border-2:#234078;
  --primary:#3b82f6;--primary-2:#06b6d4;
  --accent:#22d3ee;--accent-2:#a78bfa;--accent-3:#f472b6;
  --gold:#fbbf24;--silver:#cbd5e1;--bronze:#cd7f32;
  --success:#10b981;--danger:#ef4444;--warn:#f59e0b;
  --text:#e2e8f0;--muted:#7c93bb;
  --glass:rgba(13,26,51,.6);
  --radius:20px;--radius-sm:12px;
  --transition:.28s cubic-bezier(.22,1,.36,1);
  --shadow-lg:0 20px 60px rgba(0,0,0,.4);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 15% 20%, rgba(59,130,246,.22), transparent 42%),
    radial-gradient(circle at 85% 80%, rgba(6,182,212,.16), transparent 48%),
    radial-gradient(circle at 50% 100%, rgba(167,139,250,.10), transparent 60%),
    radial-gradient(ellipse 100% 60% at 50% -20%, #0a1f4d 0%, var(--bg) 60%);
  animation:bgShift 20s ease-in-out infinite alternate;
}
@keyframes bgShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(15deg)}}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(59,130,246,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
  animation:gridFloat 30s linear infinite;
}
@keyframes gridFloat{0%{background-position:0 0}100%{background-position:44px 44px}}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--accent);opacity:.4;
  box-shadow:0 0 12px currentColor;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0}
  10%{opacity:.6}
  90%{opacity:.6}
  100%{transform:translateY(-100px) translateX(40px);opacity:0}
}
.app{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:0 18px 80px}

/* ===== Topbar ===== */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 6px;
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  background:linear-gradient(180deg, rgba(5,11,26,.85), rgba(5,11,26,.4));
  border-bottom:1px solid rgba(59,130,246,.08);
}
.brand{
  font-size:1.55rem;font-weight:900;letter-spacing:-.6px;
  background:linear-gradient(135deg,#60a5fa,#22d3ee 50%,#a78bfa);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  display:flex;align-items:center;gap:9px;
  cursor:pointer;user-select:none;
  animation:brandShimmer 6s ease-in-out infinite;
  transition:var(--transition);
}
@keyframes brandShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand:hover{transform:scale(1.03)}
.brand .dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
  animation:pulseDot 2s infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.topbar-actions{display:flex;gap:8px;align-items:center}
.buo-badge{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:14px;
  background:linear-gradient(135deg, rgba(251,191,36,.18), rgba(245,158,11,.08));
  border:1px solid rgba(251,191,36,.4);
  font-size:.82rem;font-weight:700;color:var(--gold);
  white-space:nowrap;cursor:pointer;transition:var(--transition);
}
.buo-badge:hover{transform:scale(1.04);box-shadow:0 0 20px rgba(251,191,36,.3)}
.icon-btn{
  width:48px;height:48px;border-radius:14px;
  border:1px solid var(--border);
  background:var(--glass);color:var(--text);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);font-size:1.2rem;
  position:relative;overflow:hidden;
}
.icon-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(59,130,246,.2), rgba(34,211,238,.15));
  opacity:0;transition:var(--transition);
}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
.icon-btn:hover::before{opacity:1}
.icon-btn span{position:relative;z-index:1}
.icon-btn .lang-code{
  position:absolute;bottom:3px;right:6px;
  font-size:.6rem;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:.5px;
}
.menu-btn{
  width:48px;height:48px;border-radius:14px;
  border:1px solid var(--border);
  background:var(--glass);color:var(--text);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;transition:var(--transition);
}
.menu-btn:hover{border-color:var(--primary);background:rgba(59,130,246,.15)}
.menu-btn span{width:5px;height:5px;border-radius:50%;background:var(--text);transition:var(--transition)}
.menu-btn:hover span{background:var(--accent);transform:scale(1.4)}

.menu-drop,.lang-drop{
  position:absolute;top:70px;right:18px;z-index:100;
  background:linear-gradient(180deg, rgba(13,26,51,.98), rgba(10,20,40,.98));
  backdrop-filter:blur(20px);
  border:1px solid var(--border-2);border-radius:18px;
  padding:8px;min-width:280px;
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(59,130,246,.15) inset;
  opacity:0;transform:translateY(-12px) scale(.94);pointer-events:none;
  transition:var(--transition);
  max-height:520px;overflow-y:auto;
}
.menu-drop.open,.lang-drop.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.menu-drop::-webkit-scrollbar,.lang-drop::-webkit-scrollbar{width:6px}
.menu-drop::-webkit-scrollbar-thumb,.lang-drop::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:5px}
.menu-item{
  display:flex;align-items:center;gap:13px;
  padding:14px 16px;border-radius:12px;cursor:pointer;
  font-size:.95rem;font-weight:500;transition:var(--transition);
  border:1px solid transparent;position:relative;
}
.menu-item:hover{
  background:linear-gradient(135deg, rgba(59,130,246,.18), rgba(6,182,212,.08));
  border-color:rgba(59,130,246,.2);
  transform:translateX(3px);
}
.menu-item .ic{
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(135deg, rgba(59,130,246,.28), rgba(6,182,212,.18));
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;flex-shrink:0;
  border:1px solid rgba(59,130,246,.32);
  transition:var(--transition);
}
.menu-item:hover .ic{transform:scale(1.08) rotate(-4deg)}
.menu-item.event .ic{background:linear-gradient(135deg, rgba(239,68,68,.3), rgba(250,204,21,.2));border-color:rgba(239,68,68,.4)}
.menu-item.shop .ic{background:linear-gradient(135deg, rgba(251,191,36,.3), rgba(245,158,11,.2));border-color:rgba(251,191,36,.4)}
.menu-item.redeem .ic{background:linear-gradient(135deg, rgba(16,185,129,.3), rgba(6,182,212,.2));border-color:rgba(16,185,129,.4)}
.menu-item .ic-img{
  width:40px;height:40px;border-radius:50%;background:#1a2f57;
  overflow:hidden;flex-shrink:0;border:1px solid var(--border-2);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;color:var(--accent);
}
.menu-item .ic-img img{width:100%;height:100%;object-fit:cover}
.menu-item small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.menu-item .badge-new{
  position:absolute;top:8px;right:10px;
  background:linear-gradient(135deg,#ef4444,#f59e0b);
  color:#fff;font-size:.6rem;font-weight:800;
  padding:3px 7px;border-radius:8px;
  letter-spacing:.4px;animation:pulseDot 1.6s infinite;
}
.menu-sep{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:6px 4px}

.lang-item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-radius:12px;cursor:pointer;font-size:.92rem;
  transition:var(--transition);border:1px solid transparent;
}
.lang-item:hover{background:rgba(59,130,246,.15);transform:translateX(3px)}
.lang-item.active{
  background:linear-gradient(135deg, rgba(59,130,246,.22), rgba(6,182,212,.12));
  border-color:var(--primary);
}
.lang-item .flag{font-size:1.4rem;flex-shrink:0}
.lang-item .name{flex:1}
.lang-item .code{font-size:.72rem;color:var(--muted);text-transform:uppercase;font-weight:600}
.lang-search{
  width:100%;padding:11px 14px;margin-bottom:6px;
  background:rgba(5,11,26,.7);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.9rem;
  outline:none;font-family:inherit;
}
.lang-search:focus{border-color:var(--primary)}

/* ===== Cards ===== */
.card{
  background:linear-gradient(180deg, rgba(13,26,51,.95), rgba(10,20,40,.95));
  backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:26px;position:relative;overflow:hidden;
  box-shadow:0 0 0 1px rgba(59,130,246,.08) inset, var(--shadow-lg);
  transition:var(--transition);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.6),transparent);
  animation:cardGlow 3s ease-in-out infinite;
}
@keyframes cardGlow{0%,100%{opacity:.5}50%{opacity:1}}
.card:hover{border-color:rgba(59,130,246,.35)}
.card + .card{margin-top:18px}
.card.event-card{border-color:rgba(239,68,68,.35)}
.card.event-card::before{background:linear-gradient(90deg,transparent,rgba(239,68,68,.7),rgba(250,204,21,.7),transparent)}
.card.shop-card::before{background:linear-gradient(90deg,transparent,rgba(251,191,36,.7),transparent)}

/* ===== Hero ===== */
.hero{text-align:center;padding:28px 0 36px;position:relative}
.hero h1{
  font-size:clamp(1.8rem, 5vw, 2.6rem);
  font-weight:900;letter-spacing:-1.2px;
  background:linear-gradient(135deg,#60a5fa,#22d3ee 50%,#a78bfa);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:10px;
  animation:brandShimmer 6s ease-in-out infinite;
  line-height:1.15;
}
.hero p{color:var(--muted);font-size:.94rem;line-height:1.6}
.vn-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;margin-bottom:16px;
  background:linear-gradient(135deg, rgba(239,68,68,.14), rgba(250,204,21,.08));
  border:1px solid rgba(239,68,68,.35);
  border-radius:24px;font-size:.78rem;font-weight:600;
  color:#fbbf24;text-transform:uppercase;letter-spacing:.6px;
  animation:vnGlow 3s ease-in-out infinite;
}
@keyframes vnGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}
  50%{box-shadow:0 0 20px 2px rgba(239,68,68,.25)}
}
.vn-badge .flag{font-size:1rem;filter:drop-shadow(0 0 4px rgba(239,68,68,.5))}
.sec-badge{
  display:inline-flex;align-items:center;gap:6px;padding:5px 12px;
  background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);
  border-radius:20px;font-size:.72rem;color:#6ee7b7;font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;
}
.event-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;margin-bottom:16px;
  background:linear-gradient(135deg, rgba(239,68,68,.22), rgba(251,191,36,.15));
  border:2px solid rgba(251,191,36,.5);
  border-radius:24px;font-size:.85rem;font-weight:800;
  color:#fbbf24;text-transform:uppercase;letter-spacing:.8px;
  animation:eventPulse 2s ease-in-out infinite;
}
@keyframes eventPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.4), 0 0 20px rgba(239,68,68,.2)}
  50%{box-shadow:0 0 30px 4px rgba(251,191,36,.5), 0 0 40px rgba(239,68,68,.3)}
}

/* ===== Form ===== */
.form-group{margin-bottom:18px;position:relative}
.form-group label{
  display:block;font-size:.82rem;font-weight:600;
  color:var(--muted);margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.6px;
}
.form-group input, .form-group textarea, .form-group select{
  width:100%;background:rgba(5,11,26,.7);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:16px 18px;color:var(--text);font-size:1rem;
  outline:none;transition:var(--transition);font-family:inherit;
}
.form-group input:focus, .form-group textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(59,130,246,.14), 0 0 20px rgba(59,130,246,.2);
}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px 22px;border:none;border-radius:16px;
  font-size:1.05rem;font-weight:700;cursor:pointer;
  transition:var(--transition);font-family:inherit;
  position:relative;overflow:hidden;
  letter-spacing:.2px;min-height:56px;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(135deg,#3b82f6,#06b6d4);
  color:#fff;box-shadow:0 10px 28px rgba(59,130,246,.4);
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(59,130,246,.55)}
.btn-success{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;box-shadow:0 10px 28px rgba(16,185,129,.4)}
.btn-success:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(16,185,129,.55)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1a1a1a;box-shadow:0 10px 28px rgba(251,191,36,.5);font-weight:800}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(251,191,36,.65)}
.btn-outline{background:rgba(59,130,246,.1);border:2px solid var(--border-2);color:var(--text);}
.btn-outline:hover{background:rgba(59,130,246,.22);border-color:var(--primary);transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 10px 28px rgba(239,68,68,.4)}
.btn-danger:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(239,68,68,.55)}
.btn-sm{padding:12px 20px;font-size:.92rem;width:auto;border-radius:12px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;box-shadow:none !important}

/* ===== Animations ===== */
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-7px)}
  75%{transform:translateX(7px)}
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}
  70%{box-shadow:0 0 0 25px rgba(239,68,68,0)}
  100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}
}
@keyframes popUp{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}
  100%{opacity:0;transform:translate(-50%,-180%) scale(1.2)}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes buoFly{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0;transform:translate(-50%,-250%) scale(1.4)}
}
@keyframes firework{
  0%{transform:translate(var(--x),var(--y)) scale(0);opacity:1}
  50%{opacity:1}
  100%{transform:translate(calc(var(--x)*2.5),calc(var(--y)*2.5)) scale(1);opacity:0}
}
@keyframes confettiFall{
  0%{transform:translateY(-10vh) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}
@keyframes pulseGold{
  0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.6),0 0 30px rgba(251,191,36,.3)}
  50%{box-shadow:0 0 0 12px rgba(251,191,36,0),0 0 50px rgba(251,191,36,.5)}
}
@keyframes flagWave{
  0%,100%{transform:rotate(-3deg) scale(1)}
  50%{transform:rotate(3deg) scale(1.05)}
}
@keyframes shineSweep{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
@keyframes scorePop{
  0%{transform:scale(.3);opacity:0}
  60%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}
@keyframes musicPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
.music-btn{
  position:fixed;bottom:24px;right:24px;z-index:200;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#ef4444,#fbbf24);
  border:2px solid rgba(251,191,36,.6);
  color:#fff;font-size:1.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(239,68,68,.45);
  transition:var(--transition);
  animation:musicPulse 2s ease-in-out infinite;
}
.music-btn:hover{transform:scale(1.1);box-shadow:0 12px 36px rgba(239,68,68,.6)}
.music-btn.playing{animation:none;background:linear-gradient(135deg,#10b981,#06b6d4)}
.anniversary-banner{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 20px;margin-bottom:18px;
  background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(251,191,36,.18));
  border:2px solid rgba(251,191,36,.55);
  border-radius:20px;font-weight:800;font-size:.95rem;
  color:#fbbf24;text-align:center;
  animation:pulseGold 2.5s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.anniversary-banner::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  background-size:200% 100%;
  animation:shineSweep 3s linear infinite;
}
.event-wow-header{
  text-align:center;padding:36px 20px 28px;
  background:linear-gradient(160deg,rgba(239,68,68,.22),rgba(251,191,36,.12),rgba(167,139,250,.08));
  border:2px solid rgba(251,191,36,.45);
  border-radius:28px;margin-bottom:22px;
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(239,68,68,.2), inset 0 0 40px rgba(251,191,36,.05);
}
.event-wow-header .big-flag{
  font-size:4.5rem;display:inline-block;
  animation:flagWave 2.5s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(239,68,68,.6));
}
.event-wow-header h1{
  font-size:clamp(1.9rem,5.5vw,2.8rem);font-weight:900;
  background:linear-gradient(135deg,#ef4444,#fbbf24 40%,#f59e0b 70%,#ef4444);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:brandShimmer 4s ease-in-out infinite;
  margin:10px 0 8px;
}
.confetti-canvas{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
}
.fireworks-container{
  position:fixed;inset:0;pointer-events:none;z-index:9997;overflow:hidden;
}
.firework-particle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  animation:firework 1.2s ease-out forwards;
}

.section-title{
  font-size:.82rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;margin-bottom:12px;letter-spacing:.8px;
  display:flex;align-items:center;gap:9px;
}
.section-title::before{
  content:'';width:4px;height:16px;
  background:linear-gradient(180deg,var(--accent),var(--primary));
  border-radius:2px;
  box-shadow:0 0 10px rgba(34,211,238,.5);
}

.result-box{

.short-link{

.task-header{text-align:center;margin-bottom:24px}

}

}

}

}

<script>
'use strict';

/* ============================================================

const VERSION = 'v7.5';

const LS_RANK = 'linkgo_rank_v7';

   ============ SECURITY CORE ===============================

const SECURITY = Object.freeze({
  MAX_URL_LENGTH: 2048, MAX_NAME_LENGTH: 40,
  MAX_AVATAR_BYTES: 512 * 1024, MAX_LINKS_PER_USER: 100,
  MIN_PASSWORD_LENGTH: 8,

  TOKEN_LENGTH: 12, PBKDF2_ITERATIONS: 250000,

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function hashPassword(password, saltB64 = null) {
  const enc = new TextEncoder();
  const saltBytes = saltB64
    ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0))
    : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: saltBytes, iterations: SECURITY.PBKDF2_ITERATIONS, hash: 'SHA-256' },
    keyMaterial, 256
  );
  const hashHex = Array.from(new Uint8Array(bits))
    .map(b => b.toString(16).padStart(2, '0')).join('');
  const saltOut = btoa(String.fromCharCode(...saltBytes));
  return { hash: hashHex, salt: saltOut };
}
async function verifyPassword(password, storedHash, storedSalt) {
  if (!storedHash || !storedSalt) return false;
  const { hash } = await hashPassword(password, storedSalt);
  if (hash.length !== storedHash.length) return false;
  let diff = 0;
  for (let i = 0; i < hash.length; i++) diff |= hash.charCodeAt(i) ^ storedHash.charCodeAt(i);
  return diff === 0;
}

function randomToken(len = SECURITY.TOKEN_LENGTH) {
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}
function randomString(len, pool) {
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return Array.from(bytes, b => pool[b % pool.length]).join('');
}

function sanitizeUrl(raw) {
  if (typeof raw !== 'string') return null;
  const trimmed = raw.trim();
  if (!trimmed || trimmed.length > SECURITY.MAX_URL_LENGTH) return null;
  let url;
  try { url = new URL(trimmed); } catch { return null; }
  if (!SECURITY.ALLOWED_URL_SCHEMES.includes(url.protocol)) return null;
  const host = url.hostname.toLowerCase();
  if (/^(localhost|127\.|0\.0\.0\.0|10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)/.test(host)) return null;
  if (host === '0' || host === '') return null;
  return url.href;
}
function sanitizeName(raw) {
  if (typeof raw !== 'string') return 'Siteblog';
  const clean = raw.trim().replace(/[^\p{L}\p{N}\s\-_.]/gu, '').slice(0, SECURITY.MAX_NAME_LENGTH);
  return clean || 'Siteblog';
}
function nameToSlug(name) {
  return (name || 'Site').replace(/[^\p{L}\p{N}\-_]/gu, '').slice(0, 12) || 'Site';
}

async function validateAvatar(file) {
  if (!file) return { ok: false, reason: 'Không có file' };
  if (!SECURITY.ALLOWED_IMAGE_TYPES.includes(file.type))
    return { ok: false, reason: 'Chỉ JPG/PNG/WebP/GIF' };
  if (file.size > SECURITY.MAX_AVATAR_BYTES)
    return { ok: false, reason: 'Ảnh vượt quá 512KB' };
  const buf = await file.slice(0, 12).arrayBuffer();
  const b = new Uint8Array(buf);
  const isJpg = b[0] === 0xFF && b[1] === 0xD8;
  const isPng = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47;
  const isGif = b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46;
  const isWebp = b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50;
  if (!isJpg && !isPng && !isGif && !isWebp)
    return { ok: false, reason: 'File không phải ảnh' };
  return { ok: true };
}

const RateLimit = {
  _key: 'linkgo_ratelimit_v7',
  check(action = 'createLink') {
    const now = Date.now();
    let data = {};
    try { data = JSON.parse(localStorage.getItem(this._key) || '{}'); } catch {}
    const bucket = Array.isArray(data[action]) ? data[action] : [];
    const recent = bucket.filter(t => now - t < SECURITY.RATE_LIMIT_WINDOW);
    if (recent.length >= SECURITY.RATE_LIMIT_MAX) {
      return { ok: false, retryIn: Math.ceil((SECURITY.RATE_LIMIT_WINDOW - (now - recent[0])) / 1000) };
    }
    recent.push(now);
    data[action] = recent;
    try { localStorage.setItem(this._key, JSON.stringify(data)); } catch {}
    return { ok: true };
  }
};

const SafeStore = {
  set(key, obj) {
    try { localStorage.setItem(key, JSON.stringify(obj)); return true; }
    catch (e) { console.warn('[LinkGO]', e); return false; }
  },
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch { return fallback; }
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

function tokenToKey(token) {
  const enc = new TextEncoder();
  const seed = enc.encode(token + '|linkgo-v7|' + token.length);
  const key = new Uint8Array(32);
  for (let i = 0; i < key.length; i++) key[i] = seed[i % seed.length] ^ ((i * 37 + 11) & 0xff);
  return key;
}
function xorBytes(data, key) {
  const out = new Uint8Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] ^ key[i % key.length];
  return out;
}
const URL_PREFIXES = [['https://','H'],['http://','h'],['www.','w']];
const TASK_SHORTHAND = {
  tap:'a',seq:'b',wait:'c',phrase:'d',hold:'e',color:'f',slider:'g',
  checklist:'h',emoji:'i',drag:'j',doubleTap:'k',reverse:'l',
  tap500:'m',tap2000:'n',tap50000:'o',wait5:'p',wait30:'q',wait60:'r',
  phraseLong:'s',phraseCap:'t',phraseLow:'u',hold3:'v',hold10:'w',hold15:'x',
  colorAdv:'y',colorTarget:'z',sliderTight:'A',slider3:'B',
  checklist10:'C',checklist20:'D',emoji50:'E',emoji100:'F',emojiFast:'G',
  drag3:'I',dragLong:'J',doubleTap5:'K',doubleTap50:'L',tripleTap:'M',
  reverse10:'N',ascend:'O',descend:'P',evenOnly:'Q',oddOnly:'R',primeOnly:'S',
  swipeUp:'T',swipeDown:'U',swipeLeft:'V',swipeRight:'W',
  shake:'X',tilt:'Y',keyboard:'Z',keyboard2:'0',keyboard3:'1',
  mathAdd:'2',mathSub:'3',mathMul:'4',mathDiv:'5',
  memorySeq:'6',memorySeq7:'7',memoryColor:'8',memoryEmoji:'9',
  mirror:'!',counting:'@',typing100:'#',typing200:'$',
  wordCount:'%',vowelCount:'^',consonantCount:'&',uppercaseCount:'*',
  digitCount:'(',clickSeq:')',clickSeq7:'-',doubleClick:'_',
  hover:'=',scrollTop:'+',scrollBottom:'[',fullscreen:']',
  rotate:'{',vibrate:'}',battery:':',time:';',date:'"',
  random:'.',dice:',',coin:'<',captcha:'>',captcha2:'?',

};
const TASK_R = Object.fromEntries(Object.entries(TASK_SHORTHAND).map(([k,v]) => [v, k]));

async function shortHash(input) {
  const enc = new TextEncoder();
  const data = enc.encode(input);
  let h = 0x811c9dc5;
  for (let i = 0; i < data.length; i++) { h ^= data[i]; h = (h * 0x01000193) >>> 0; }
  h ^= h >>> 16; h = (h * 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = (h * 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) { out += chars[h % 32]; h = Math.floor(h / 32); }
  return out;
}

async function signPayload(obj) {
  let urlShort = obj.url;
  for (const [full, short] of URL_PREFIXES) {
    if (obj.url.startsWith(full)) { urlShort = short + obj.url.slice(full.length); break; }
  }
  const tasksShort = obj.tasks.map(t => TASK_SHORTHAND[t] || '?').join('');
  const compact = `${urlShort}\u0001${tasksShort}\u0001${obj.ts || Date.now()}\u0001${obj.nonce}`;
  const enc = new TextEncoder();
  const raw = enc.encode(compact);
  const key = tokenToKey(obj.token);
  const xored = xorBytes(raw, key);
  let bin = '';
  for (let i = 0; i < xored.length; i++) bin += String.fromCharCode(xored[i]);
  const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const checksum = await shortHash(compact + obj.token);
  return b64 + '~' + checksum;
}

async function verifyAndDecode(str, token) {
  if (typeof str !== 'string' || !str.includes('~')) return null;
  const idx = str.lastIndexOf('~');
  const b64 = str.slice(0, idx), checksum = str.slice(idx + 1);
  if (!b64 || !checksum || checksum.length !== 4) return null;
  let xored;
  try {
    let s = b64.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    xored = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) xored[i] = bin.charCodeAt(i);
  } catch { return null; }
  const key = tokenToKey(token);
  const raw = xorBytes(xored, key);
  let compact;
  try { compact = new TextDecoder().decode(raw); }
  catch { return null; }
  const parts = compact.split('\u0001');
  if (parts.length !== 4) return null;
  const [urlShort, tasksShort, tsStr, nonce] = parts;
  const expect = await shortHash(compact + token);
  if (expect !== checksum) return null;
  let url = urlShort;
  for (const [full, short] of URL_PREFIXES) {
    if (url.startsWith(short)) { url = full + url.slice(1); break; }
  }
  const tasks = [];
  for (const c of tasksShort) if (TASK_R[c]) tasks.push(TASK_R[c]);
  return { url, tasks, ts: parseInt(tsStr), nonce };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const TamperGuard = {
  _key: LS_TAMPER,
  isLocked() {
    const data = SafeStore.get(this._key, {});
    return data.lockedUntil && Date.now() < data.lockedUntil;
  },
  lockTimeLeft() {
    const data = SafeStore.get(this._key, {});
    if (!data.lockedUntil) return 0;
    return Math.max(0, Math.ceil((data.lockedUntil - Date.now()) / 1000));
  },
  trigger(reason = 'unknown') {
    const data = SafeStore.get(this._key, {});
    data.lockedUntil = Date.now() + SECURITY.TAMPER_LOCK_MS;
    data.reason = reason;
    data.count = (data.count || 0) + 1;
    SafeStore.set(this._key, data);
    console.warn('[LinkGO] Tamper:', reason);
  },
  clear() { SafeStore.remove(this._key); }
};

const NATIVE = {

const ProgressStore = {
  _key: LS_PROGRESS,
  getAll() {
    const data = SafeStore.get(this._key, {});
    const now = Date.now();
    let dirty = false;
    for (const k of Object.keys(data)) {
      if (!data[k].lastUpdate || now - data[k].lastUpdate > SECURITY.PROGRESS_TTL_MS) {
        delete data[k]; dirty = true;
      }

    if (dirty) SafeStore.set(this._key, data);
    return data;
  },
  get(nonce) { return this.getAll()[nonce] || null; },
  start(nonce, token, taskCount) {
    const all = this.getAll();
    all[nonce] = {
      token, taskCount, completed: [],
      startedAt: Date.now(), lastUpdate: Date.now(),
      verified: false, sig: null,
    };
    SafeStore.set(this._key, all);
    return all[nonce];
  },
  markTask(nonce, idx) {
    const all = this.getAll();
    if (!all[nonce]) return null;
    if (!all[nonce].completed.includes(idx)) all[nonce].completed.push(idx);
    all[nonce].lastUpdate = Date.now();
    SafeStore.set(this._key, all);
    return all[nonce];
  },
  async finalize(nonce) {
    const all = this.getAll();
    if (!all[nonce]) return null;
    const p = all[nonce];
    if (p.completed.length !== p.taskCount) { TamperGuard.trigger('incomplete'); return null; }
    const elapsed = Date.now() - p.startedAt;
    if (elapsed < SECURITY.MIN_LINK_DURATION_MS) { TamperGuard.trigger('too_fast'); return null; }
    p.verified = true;
    p.sig = await shortHash(p.token + nonce + p.startedAt + p.completed.length);
    p.lastUpdate = Date.now();
    SafeStore.set(this._key, all);
    return p;
  },
  isVerified(nonce) {
    const p = this.get(nonce);
    return p && p.verified && p.sig;
  },
  reset(nonce) {
    const all = this.getAll();
    delete all[nonce];
    SafeStore.set(this._key, all);
  },
};

/* ============================================================

const BuoStore = {
  getUserKey() {
    return currentUser ? currentUser.email : 'guest';
  },
  getAll() {
    return SafeStore.get(LS_BUO, {});
  },
  getBalance() {
    const all = this.getAll();
    return all[this.getUserKey()] || 0;
  },
  add(amount, reason = '') {
    const all = this.getAll();
    const key = this.getUserKey();
    all[key] = (all[key] || 0) + amount;
    SafeStore.set(LS_BUO, all);
    updateTopBuo();
    return all[key];
  },
  spend(amount) {
    const all = this.getAll();
    const key = this.getUserKey();
    if ((all[key] || 0) < amount) return false;
    all[key] -= amount;
    SafeStore.set(LS_BUO, all);
    updateTopBuo();
    return true;
  },
  set(amount) {
    const all = this.getAll();
    all[this.getUserKey()] = amount;
    SafeStore.set(LS_BUO, all);
    updateTopBuo();
  },
};

function updateTopBuo() {
  const elx = $('topBuo');
  if (elx) elx.textContent = BuoStore.getBalance();
}

   ============ CODE STORE ==================================
   ============================================================ */
const CodeStore = {
  getAll() {
    return SafeStore.get(LS_CODES, {});
  },
  saveAll(data) {
    SafeStore.set(LS_CODES, data);
  },
  create(tier) {
    const pools = {
      bronze: 'LINKG0-VIP-',
      silver: 'LINKG0-VVIP-',
      gold: 'LINKG0-SSS-VIP',
    };
    const suffixes = {
      bronze: '-C0DE',
      silver: '-LGCODE',
      gold: '-LINKGO-CODE',
    };
    const randomPart = randomString(35, 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789');
    const code = `${pools[tier]}${randomPart}${suffixes[tier]}`;
    const all = this.getAll();
    const userKey = currentUser ? currentUser.email : 'guest';
    if (!all[userKey]) all[userKey] = [];
    all[userKey].push({
      code,
      tier,
      createdAt: Date.now(),
      expiresAt: Date.now() + CODE_EXPIRY_MS,
      used: false,
    });
    this.saveAll(all);
    return code;
  },
  getMine() {
    const all = this.getAll();
    const userKey = currentUser ? currentUser.email : 'guest';
    return (all[userKey] || []).filter(c => !c.used);
  },
  validate(code) {
    const all = this.getAll();
    for (const userKey of Object.keys(all)) {
      const list = all[userKey];
      for (const item of list) {
        if (item.code === code && !item.used && Date.now() < item.expiresAt) {
          return { ok: true, item, owner: userKey };
        }
      }
    }
    return { ok: false };
  },
  markUsed(code) {
    const all = this.getAll();
    for (const userKey of Object.keys(all)) {
      for (const item of all[userKey]) {
        if (item.code === code) {
          item.used = true;
          item.usedAt = Date.now();
          this.saveAll(all);
          return true;
        }
      }
    }
    return false;
  },
};

const EventStore = {
  getProgress() {
    const all = SafeStore.get(LS_QUIZ_PROGRESS, {});
    return all[currentUser?.email || 'guest'] || null;
  },
  saveProgress(p) {
    const all = SafeStore.get(LS_QUIZ_PROGRESS, {});
    all[currentUser?.email || 'guest'] = p;
    SafeStore.set(LS_QUIZ_PROGRESS, all);
  },
  isEventActive() {
    const now = Date.now();
    return now >= EVENT_START.getTime() && now <= EVENT_END.getTime();
  },
  getTimeLeft() {
    const now = Date.now();
    if (now < EVENT_START.getTime()) return { state: 'not_started', ms: EVENT_START.getTime() - now };
    if (now > EVENT_END.getTime()) return { state: 'ended', ms: 0 };
    return { state: 'active', ms: EVENT_END.getTime() - now };
  },
  startBatch() {
    const p = this.getProgress();
    if (p && !p.completed) return p;
    const batch = shuffle(EVENT_QUESTIONS).slice(0, 5);
    const newP = {
      batchId: randomToken(8),
      questions: batch.map(q => ({
        q: q.q,
        opts: shuffle(q.opts.map((opt, i) => ({ text: opt, correct: i === q.ans }))),
      })),
      answers: [],
      completed: false,
      startedAt: Date.now(),
    };
    this.saveProgress(newP);
    return newP;
  },
  answer(qIdx, optIdx) {
    const p = this.getProgress();
    if (!p || p.completed) return null;
    p.answers[qIdx] = optIdx;
    this.saveProgress(p);
    return p;
  },
  finish() {
    const p = this.getProgress();
    if (!p || p.completed) return null;
    let correct = 0;
    p.questions.forEach((qq, i) => {
      const ans = p.answers[i];
      if (ans != null && qq.opts[ans] && qq.opts[ans].correct) correct++;
    });
    p.completed = true;
    p.correct = correct;
    p.total = p.questions.length;
    p.percent = Math.round(correct / p.questions.length * 100);
    p.passed = p.percent >= 80;
    p.finishedAt = Date.now();
    this.saveProgress(p);
    if (p.passed) {
      const gained = LINKBUO_PER_CORRECT;
      BuoStore.add(gained, 'event');
      p.rewarded = gained;
      this.saveProgress(p);
    }
    return p;
  },
  resetBatch() {
    const all = SafeStore.get(LS_QUIZ_PROGRESS, {});
    delete all[currentUser?.email || 'guest'];
    SafeStore.set(LS_QUIZ_PROGRESS, all);
  },
};

function getShortLinkData() {
  const hash = location.hash.slice(1);
  if (!hash.startsWith('/')) return null;
  const [path, query] = hash.split('?');
  const parts = path.split('/').filter(Boolean);
  if (parts.length >= 2 && parts[0] === 'u') {
    return { profileUser: decodeURIComponent(parts[1]) };
  }
  if (parts.length >= 3 && parts[2] === SITE) {
    const token = parts[0];
    if (!/^[A-Za-z0-9]{8,24}$/.test(token)) return null;
    const params = new URLSearchParams(query || '');
    const data = params.get('t');
    if (!data || !data.includes('~')) return null;
    return { token, name: decodeURIComponent(parts[1]), data };
  }
  return null;
}

function pickAvatar() { const i = $('avatarInput'); if (i) i.click(); }
async function onAvatarPick(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const v = await validateAvatar(file);
  if (!v.ok) { alert('Ảnh không hợp lệ: ' + v.reason); e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        pickedAvatarDataUrl = canvas.toDataURL('image/jpeg', 0.85);
        updateAvatarPreview();
      } catch { alert('Không xử lý được ảnh'); }
    };
    img.onerror = () => alert('Ảnh bị lỗi');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function updateAvatarPreview() {
  const prev = $('avatarPreview');
  if (!prev) return;
  if (pickedAvatarDataUrl) prev.innerHTML = `<img src="${escapeHtml(pickedAvatarDataUrl)}" alt="">`;
  else {
    const n = ($('rgName')?.value || '').trim();
    prev.innerHTML = `<span>${escapeHtml(n ? n.charAt(0).toUpperCase() : '?')}</span>`;
  }
}
document.addEventListener('input', e => {

});
async function doRegister() {
  const name = ($('rgName')?.value || '').trim();
  const email = ($('rgEmail')?.value || '').trim().toLowerCase();
  const pass = $('rgPass')?.value || '';
  const err = $('rgErr');
  const showErr = msg => { err.textContent = msg; err.classList.add('show'); };
  if (!name || name.length < 2) return showErr('Tên cần ít nhất 2 ký tự');
  if (name.length > 30) return showErr('Tên quá dài');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Email không hợp lệ');
  if (pass.length < SECURITY.MIN_PASSWORD_LENGTH) return showErr(`Mật khẩu ≥ ${SECURITY.MIN_PASSWORD_LENGTH}`);
  if (!/[A-Z]/.test(pass) || !/[a-z]/.test(pass) || !/[0-9]/.test(pass))
    return showErr('Cần chữ HOA, thường, số');
  const existing = SafeStore.get(LS_USER, null);
  if (existing && existing.email === email) return showErr('Email đã đăng ký trên máy này');
  try {
    const { hash, salt } = await hashPassword(pass);
    currentUser = {
      name: escapeHtml(name), email,
      passwordHash: hash, passwordSalt: salt,
      avatar: pickedAvatarDataUrl || null,
      createdAt: Date.now(),
      rank: null, titles: [],
    };
    saveUser();
    pickedAvatarDataUrl = null;
    go('profile');
  } catch (e) { showErr('Lỗi: ' + e.message); }
}
async function doLogin() {
  const email = ($('lgEmail')?.value || '').trim().toLowerCase();
  const pass = $('lgPass')?.value || '';
  const err = $('lgErr');
  const showErr = msg => { err.textContent = msg; err.classList.add('show'); };
  if (!email || !pass) return showErr('Nhập đầy đủ');
  const rl = RateLimit.check('login');
  if (!rl.ok) return showErr(`Quá nhiều lần thử. Đợi ${rl.retryIn}s`);
  const stored = SafeStore.get(LS_USER, null);
  if (!stored) return showErr('Chưa có tài khoản trên máy này');
  try {
    const ok = await verifyPassword(pass, stored.passwordHash, stored.passwordSalt);
    if (!ok || stored.email !== email) return showErr('Email hoặc mật khẩu sai');
    currentUser = stored;
    TamperGuard.clear();
    updateTopBuo();
    go('profile');
  } catch (e) { showErr('Lỗi: ' + e.message); }
}
function logout() {
  currentUser = null;
  saveUser();
  const m = $('menuDrop'); if (m) m.classList.remove('open');
  go('main');
}

function formatDuration(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (d > 0) return `${d} ngày ${h}h ${m}m`;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function buyRank(tier, price) {
  if (!currentUser) return;
  if (currentUser.rank) {
    const order = { bronze: 1, silver: 2, gold: 3 };

      toast('⚠️ Bạn đã có rank tương đương hoặc cao hơn');
      return;
    }
  }
  if (!confirm(`Đổi ${price} LinkBUO lấy rank ${RankStore.getRank(tier).name}?`)) return;
  if (!BuoStore.spend(price)) { toast('❌ Không đủ LinkBUO'); return; }
  RankStore.applyToUser(tier);
  toast(`🎉 Nhận rank ${RankStore.getRank(tier).name}!`);
  renderShop();
  renderMenu();
}

        <div style="font-size:.78rem;color:var(--muted);margin-top:12px;line-height:1.6">
          💡 Code có hạn <strong>3 tuần</strong> kể từ ngày tạo.<br>
          Hết hạn code mất nhưng <strong>danh hiệu đã nhận vẫn giữ</strong>.
        </div>
      </div>

function doRedeem() {
  const input = $('redeemInput');
  if (!input) return;
  const code = input.value.trim();
  if (!code) { toast('⚠️ Nhập code trước'); return; }

  // Admin code đặc biệt
  if (code === ADMIN_CODE) {
    if (!currentUser) { toast('❌ Cần đăng nhập'); return; }
    currentUser.rank = 'gold';
    currentUser.titles = ['Thanks-Vietnam', 'VietNam-Reward', 'VietNam-Event'];
    saveUser();
    input.value = '';
    toast('👑 Admin code! Nhận rank SSS-VIP + 3 danh hiệu');
    renderRedeem();
    renderMenu();
    return;
  }

  const result = CodeStore.validate(code);
  if (!result.ok) {
    toast('❌ Code không hợp lệ hoặc đã hết hạn');
    return;
  }

  const item = result.item;
  const tier = item.tier;
  const order = { bronze: 1, silver: 2, gold: 3 };

  // Nếu chưa có rank hoặc rank mới cao hơn
  if (!currentUser.rank || order[tier] > order[currentUser.rank]) {
    currentUser.rank = tier;
    currentUser.titles = RankStore.getTitles(tier);
    saveUser();
  } else {
    // Vẫn cộng danh hiệu nếu chưa có
    const newTitles = RankStore.getTitles(tier);
    const merged = [...new Set([...(currentUser.titles || []), ...newTitles])];
    currentUser.titles = merged;
    saveUser();
  }

  CodeStore.markUsed(code);
  input.value = '';
  toast(`🎉 Nhận rank ${RankStore.getRank(tier).name}!`);
  renderRedeem();
  renderMenu();
}

function filterLinks(kind) {
  window.__linkFilter = kind;
  document.querySelectorAll('[data-filter]').forEach(b => {
    const active = b.dataset.filter === kind;
    b.style.background = active ? 'rgba(59,130,246,.3)' : '';
    b.style.borderColor = active ? 'var(--primary)' : '';
  });
  renderLinkList();
}

function renderLinkList() {
  const wrap = $('linkList');
  if (!wrap) return;
  const q = ($('linkSearch')?.value || '').trim().toLowerCase();
  const sort = $('linkSort')?.value || 'new';
  const filter = window.__linkFilter || 'all';
  let list = [...(window.__myLinks || [])];
  const now = Date.now();
  if (filter === 'today') {
    const start = new Date(); start.setHours(0,0,0,0);
    list = list.filter(l => l.createdAt >= start.getTime());
  } else if (filter === 'week') {
    list = list.filter(l => now - l.createdAt < 7 * 86400_000);
  } else if (filter === 'zero') {
    list = list.filter(l => !l.clicks);
  }
  if (q) {
    list = list.filter(l =>
      (l.target || '').toLowerCase().includes(q) ||
      (l.name || '').toLowerCase().includes(q) ||
      (l.token || '').toLowerCase().includes(q)
    );
  }
  if (sort === 'new') list.sort((a, b) => b.createdAt - a.createdAt);
  else if (sort === 'old') list.sort((a, b) => a.createdAt - b.createdAt);
  else if (sort === 'clicks') list.sort((a, b) => (b.clicks || 0) - (a.clicks || 0));
  else if (sort === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi'));

  if (list.length === 0) {
    wrap.innerHTML = `<p style="color:var(--muted);font-size:.88rem;text-align:center;padding:24px">
      ${q ? t('no_match') : t('no_links')}
    </p>`;
    return;
  }

  wrap.innerHTML = list.map(l => {
    const shortEsc = escapeHtml(l.short).replace(/'/g, "\\'");
    const targetShort = (l.target || '').length > 55
      ? escapeHtml(l.target.slice(0, 55)) + '...'
      : escapeHtml(l.target);
    const timeStr = new Date(l.createdAt).toLocaleString('vi-VN', {
      day: '2-digit', month: '2-digit', year: '2-digit',
      hour: '2-digit', minute: '2-digit',
    });
    const taskCount = Array.isArray(l.tasks) ? l.tasks.length : 0;
    return `
      <div style="padding:14px;background:rgba(5,11,26,.6);border:1px solid var(--border);border-radius:12px;margin-bottom:10px">
        <div style="min-width:0;flex:1;margin-bottom:10px">
          <div style="font-weight:600;font-size:.88rem;word-break:break-all;line-height:1.35">${targetShort}</div>
          <div style="font-size:.72rem;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap">
            <span>🎯 <strong style="color:var(--accent)">${escapeHtml(l.name)}</strong></span>
            <span>🔢 ${taskCount} task</span>
            <span>👁️ ${l.clicks || 0}</span>
          </div>
          <div style="font-size:.7rem;color:var(--muted);margin-top:4px">
            🕐 ${timeStr} • Token: <code style="color:#93c5fd">${escapeHtml(l.token || '')}</code>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-success btn-sm" onclick="copyOneLink('${shortEsc}')">${t('copy_btn')}</button>
          <button class="btn btn-outline btn-sm" onclick="showQRModal('${shortEsc}', '${escapeHtml(l.name).replace(/'/g,"\\'")}')">📱 QR</button>
          <button class="btn btn-outline btn-sm" onclick="openShort('${shortEsc}')">${t('open_btn')}</button>
          <button class="btn btn-outline btn-sm" onclick="deleteLink('${escapeHtml(l.token).replace(/'/g,"\\'")}')">${t('delete_btn')}</button>
        </div>
      </div>
    `;
  }).join('');
}

function openShort(url) {
  const hashIdx = url.indexOf('#');
  if (hashIdx >= 0) location.hash = url.slice(hashIdx + 1);
  else window.open(url, '_blank', 'noopener,noreferrer');
}
function deleteLink(token) {
  if (!confirm('Xoá link này?')) return;
  const links = loadLinks();
  const filtered = links.filter(l => !(l.token === token && l.ownerEmail === currentUser?.email));
  saveLinks(filtered);
  toast('🗑️ Đã xoá');
  renderProfile();
}
function copyProfileLink() {
  const txt = $('profShare')?.textContent || '';
  navigator.clipboard.writeText(txt).then(() => toast('✅ Đã copy')).catch(() => toast('❌ Không copy được'));
}
function shareProfile() {
  const txt = $('profShare')?.textContent || '';
  if (navigator.share) navigator.share({ title: 'LinkGO Profile', text: 'Profile của tôi', url: txt }).catch(()=>{});
  else copyProfileLink();
}
function copyOneLink(txt) {
  navigator.clipboard.writeText(txt).then(() => toast('✅ Đã copy')).catch(() => toast('❌ Không copy được'));
}
function toast(msg) {
  const tt = el('div', '', msg);
  tt.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);'
    + 'background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;padding:14px 24px;'
    + 'border-radius:14px;font-weight:600;font-size:.92rem;'
    + 'box-shadow:0 12px 32px rgba(59,130,246,.5);z-index:9999;'
    + 'animation:slideUp .3s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;';
  document.body.appendChild(tt);
  setTimeout(() => {
    tt.style.transition = 'opacity .3s, transform .3s';
    tt.style.opacity = '0';
    tt.style.transform = 'translate(-50%, 20px)';
    setTimeout(() => tt.remove(), 350);
  }, 2000);
}

function renderTaskPicker() {
  const wrap = $('taskPicker');
  if (!wrap) return;
  wrap.innerHTML = '';
  Object.keys(TASKS).forEach(key => {
    const tt = TASKS[key];
    const checked = selectedTasks.has(key);
    const opt = el('label', 'task-opt' + (checked ? ' checked' : ''));
    opt.innerHTML = `
      <span class="box">✓</span>
      <span class="lbl">${escapeHtml(tt.icon)} ${escapeHtml(tt.name)}</span>
    `;
    opt.onclick = () => {
      if (selectedTasks.has(key)) selectedTasks.delete(key);
      else selectedTasks.add(key);
      renderTaskPicker();
    };
    wrap.appendChild(opt);
  });
}
function selectAllTasks(all) {
  selectedTasks = all ? new Set(Object.keys(TASKS)) : new Set();
  renderTaskPicker();
}
function selectRandomTasks() {
  selectedTasks = new Set(shuffle(Object.keys(TASKS)).slice(0, 6));
  renderTaskPicker();
}

async function createLink() {
  const rl = RateLimit.check('createLink');
  if (!rl.ok) return toast(`⏳ Quá nhanh. Đợi ${rl.retryIn}s`);
  const target = sanitizeUrl($('targetUrl').value);
  if (!target) return alert('URL không hợp lệ (chỉ http/https)');
  const name = nameToSlug(sanitizeName($('linkName').value));
  if (selectedTasks.size === 0) return alert('Chọn ít nhất 1 nhiệm vụ!');
  const links = loadLinks();
  if (currentUser) {
    const owned = links.filter(l => l.ownerEmail === currentUser.email).length;
    if (owned >= SECURITY.MAX_LINKS_PER_USER)
      return alert(`Tối đa ${SECURITY.MAX_LINKS_PER_USER} link / tài khoản`);
  }
  try {
    const token = randomToken(12);
    const nonce = randomToken(SECURITY.NONCE_LENGTH);
    const tasks = Object.keys(TASKS).filter(k => selectedTasks.has(k));
    const encoded = await signPayload({ url: target, tasks, ts: Date.now(), nonce, token });
    const base = location.href.split('#')[0].split('?')[0];
    const short = `${base}#/${token}/${encodeURIComponent(name)}/${SITE}?t=${encoded}`;
    lastLink = { short, target, token, nonce, name, tasks };
    links.push({
      short, target, token, nonce, name, tasks,
      ownerEmail: currentUser?.email || null,
      createdAt: Date.now(),
      clicks: 0, clickFingerprints: [],
    });
    saveLinks(links);
    $('shortLink').textContent = short;
    $('tokenInfo').innerHTML =
      `Token: <code style="color:#93c5fd">${escapeHtml(token)}</code><br>` +
      `Nhiệm vụ: <strong>${tasks.length}</strong> • Độ dài: <strong>${short.length}</strong> ký tự`;
    $('resultBox').classList.add('show');
  } catch (e) { alert('Lỗi: ' + e.message); }
}
function copyLink() {
  if (!lastLink) return;
  navigator.clipboard.writeText(lastLink.short).then(() => toast('✅ Đã sao chép!')).catch(() => toast('❌ Không copy được'));
}
function showQRLast() { if (lastLink) showQRModal(lastLink.short, lastLink.name); }
function downloadTxt() {
  if (!lastLink) return;
  const c = `LinkGO ${VERSION}\n==========\nLink đích : ${lastLink.target}\nToken : ${lastLink.token}\nNonce : ${lastLink.nonce}\nTên : ${lastLink.name}\nNhiệm vụ : ${lastLink.tasks.join(', ')}\nShort link: ${lastLink.short}\nTạo lúc : ${new Date().toLocaleString('vi-VN')}\n© 2026 LinkGO — Made in Vietnam\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([c], { type: 'text/plain' }));
  a.download = `LinkGO-${lastLink.token.slice(0, 8)}.txt`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function renderTasks(data) {
  try {
    if (!data || !data.data || !data.token) {
      $('app').innerHTML = `<div class="card" style="text-align:center;padding:40px 24px">
        <div style="font-size:3rem;margin-bottom:14px">❌</div>
        <h2>Link không hợp lệ</h2>
        <button class="btn btn-primary" style="margin-top:20px" onclick="go('main')">🏠 Về trang chính</button>
      </div>`;
      return;
    }
    if (TamperGuard.isLocked()) {
      const left = TamperGuard.lockTimeLeft();
      $('app').innerHTML = `
        <div class="card" style="text-align:center;padding:40px 24px">
          <div style="font-size:3rem;margin-bottom:14px">⛔</div>
          <h2 style="color:#fca5a5">Tạm khoá ${left}s</h2>
          <p style="color:var(--muted);margin-top:12px">Phát hiện hành vi bất thường.</p>
          <button class="btn btn-primary" style="margin-top:20px" onclick="go('main')">🏠 Về trang chính</button>
        </div>
      `;
      return;
    }
    const payload = await verifyAndDecode(data.data, data.token);
    if (!payload || !payload.url) {
      $('app').innerHTML = `<div class="card" style="text-align:center;padding:40px 24px">
        <div style="font-size:3rem;margin-bottom:14px">❌</div>
        <h2>Link không hợp lệ hoặc đã bị sửa</h2>
        <button class="btn btn-primary" style="margin-top:20px" onclick="go('main')">🏠 Về trang chính</button>
      </div>`;
      return;
    }
    const safeUrl = sanitizeUrl(payload.url);
    if (!safeUrl) {
      $('app').innerHTML = `<div class="card" style="text-align:center;padding:40px 24px">
        <div style="font-size:3rem;margin-bottom:14px">❌</div>
        <h2>URL đích không hợp lệ</h2>
        <button class="btn btn-primary" style="margin-top:20px" onclick="go('main')">🏠 Về trang chính</button>
      </div>`;
      return;
    }
    targetUrl = safeUrl;
    currentNonce = payload.nonce;
    currentToken = data.token;

    let sid = sessionStorage.getItem('lg_sid');
    if (!sid) { sid = randomToken(8); sessionStorage.setItem('lg_sid', sid); }
    const fp = `${data.token}|${new Date().toDateString()}|${sid}`;
    const links = loadLinks();
    const found = links.find(l => l.token === data.token);
    if (found) {
      if (!Array.isArray(found.clickFingerprints)) found.clickFingerprints = [];
      if (!found.clickFingerprints.includes(fp)) {
        found.clickFingerprints.push(fp);
        if (found.clickFingerprints.length > 1000) found.clickFingerprints.shift();
        found.clicks = found.clickFingerprints.length;
        saveLinks(links);
      }
    }

    queue = Array.isArray(payload.tasks) && payload.tasks.length
      ? payload.tasks.filter(k => Object.prototype.hasOwnProperty.call(TASKS, k))
      : ['tap'];
    if (queue.length === 0) queue = ['tap'];
    finished = false;

    let progress = ProgressStore.get(currentNonce);
    if (!progress || progress.token !== currentToken || progress.taskCount !== queue.length) {
      progress = ProgressStore.start(currentNonce, currentToken, queue.length);
    }
    const completedSet = new Set(progress.completed);

    if (progress.verified) { redirectNow(); return; }

    const cardsHtml = queue.map((key, i) => {
      const tt = TASKS[key] || TASKS.tap;
      const isDone = completedSet.has(i);
      return `<div class="task-card${isDone ? ' done' : ''}" id="t${i}" data-idx="${i}">
        <div class="task-title"><span class="num">${i + 1}</span> ${escapeHtml(tt.icon)} ${escapeHtml(tt.name)}${isDone ? '<span class="persist-badge">✓ Đã xong</span>' : ''}</div>
        <div class="task-body" id="body${i}"></div>
      </div>`;
    }).join('');

    const resumeBanner = completedSet.size > 0 && completedSet.size < queue.length
      ? `<div class="tamper-warn" style="background:linear-gradient(135deg,rgba(16,185,129,.2),rgba(16,185,129,.05));border-color:var(--success);color:#6ee7b7">
           <span class="ic">💾</span>
           <span>${t('progress_saved')}: <strong>${completedSet.size}/${queue.length}</strong></span>
         </div>`
      : '';

    $('app').innerHTML = `
      <div class="task-header">
        <div class="vn-badge" style="margin-bottom:8px"><span class="flag">🇻🇳</span> LinkGO ${VERSION}</div>
        <h2>${t('task_protection')}</h2>
        <p>${t('complete_tasks', { n: queue.length })}</p>
      </div>
      ${resumeBanner}
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:${completedSet.size / queue.length * 100}%"></div></div>
      ${cardsHtml}
      <div class="task-card" id="tDone">
        <div class="success-screen">
          <div class="check">🎉</div>
          <h2 style="color:#6ee7b7">${t('all_complete')}</h2>
          <p style="color:var(--muted);margin:10px 0 20px">${t('redirecting')}</p>
          <div class="progress-bar" style="max-width:180px;margin:0 auto">
            <div class="progress-fill" id="redir" style="width:0%"></div>
          </div>
        </div>
      </div>
      <div class="footer">
        © 2026 LinkGO — ${t('copyright')}. ${t('all_rights')}.
      </div>
    `;
    const firstIncomplete = queue.findIndex((_, i) => !completedSet.has(i));
    showStep(firstIncomplete >= 0 ? firstIncomplete : 0);
  } catch (err) {
    console.error('[LinkGO]', err);
    $('app').innerHTML = `<div class="card" style="text-align:center;padding:40px 24px">
      <div style="font-size:3rem;margin-bottom:14px">⚠️</div>
      <h2>Lỗi xử lý link</h2>
      <p style="color:var(--muted);margin-top:12px">${escapeHtml(err.message || 'Unknown')}</p>
      <button class="btn btn-primary" style="margin-top:20px" onclick="go('main')">🏠 Về trang chính</button>
    </div>`;
  }
}

function showStep(i) {
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('active'));
  if (i >= queue.length) return goDone();
  const card = $('t' + i);
  if (!card) return goDone();
  card.classList.add('active');
  const prog = $('progress');
  if (prog) prog.style.width = (i / queue.length * 100) + '%';
  const key = queue[i];
  const body = $('body' + i);
  if (!body) return goDone();
  body.innerHTML = '';
  taskStartTime = Date.now();

  const safeDone = () => {
    const elapsed = Date.now() - taskStartTime;
    if (elapsed < SECURITY.MIN_TASK_DURATION_MS) {
      const isWaitTask = key.startsWith('wait');
      if (!isWaitTask) {
        TamperGuard.trigger('task_too_fast:' + key);
        toast('⚠️ Phát hiện thao tác bất thường');
      }
    }
    ProgressStore.markTask(currentNonce, i);
    if (prog) prog.style.width = ((i + 1) / queue.length * 100) + '%';
    NATIVE.setTimeout(() => showStep(i + 1), 300);
  };
  buildTask(key, body, safeDone);
}

async function goDone() {
  if (finished) return;
  finished = true;
  const verified = await ProgressStore.finalize(currentNonce);
  if (!verified) {
    $('app').innerHTML = `
      <div class="card" style="text-align:center;padding:40px 24px">
        <div style="font-size:3rem;margin-bottom:14px">🚫</div>
        <h2 style="color:#fca5a5">Truy cập bị từ chối</h2>
        <p style="color:var(--muted);margin-top:12px">
          Không thể xác minh hoàn thành.<br>
          ${TamperGuard.isLocked() ? `Tạm khoá trong ${TamperGuard.lockTimeLeft()}s.` : 'Vui lòng thử lại.'}
        </p>
        <button class="btn btn-outline" style="margin-top:20px" onclick="ProgressStore.reset('${currentNonce}'); location.reload()">🔄 Làm lại</button>
        <button class="btn btn-primary" style="margin-top:10px" onclick="go('main')">🏠 Về trang chính</button>
      </div>
    `;
    return;
  }
  redirectNow();
}

function redirectNow() {
  document.querySelectorAll('.task-card').forEach(c => c.classList.remove('active'));
  const done = $('tDone'); if (done) done.classList.add('active');
  const prog = $('progress'); if (prog) prog.style.width = '100%';
  let p = 0;
  const bar = $('redir');
  const iv = NATIVE.setInterval(() => {
    p += 5;
    if (bar) bar.style.width = p + '%';
    if (p >= 100) {
      NATIVE.clearInterval(iv);
      if (ProgressStore.isVerified(currentNonce)) location.href = targetUrl;
    }
  }, 40);
}

    const move = e => {
      if (!dragging) return;
      const rect = track.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - 28;
      const max = rect.width - 70;
      const px = Math.max(0, Math.min(max, x));
      handle.style.transform = `translateX(${px}px)`;
      if (px >= max - 5) { dragging = false; done(); }
    };
    const end = () => dragging = false;
    handle.addEventListener('mousedown', start);
    handle.addEventListener('touchstart', start, { passive: true });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive: true });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  };
}

      else if (op === '-') { a = Math.floor(Math.random()*50)+30; b = Math.floor(Math.random()*20)+1; ans = a-b; }
      else if (op === '*') { a = Math.floor(Math.random()*12)+2; b = Math.floor(Math.random()*12)+2; ans = a*b; }
      else { b = Math.floor(Math.random()*11)+2; ans = Math.floor(Math.random()*11)+2; a = ans*b; }
      body.innerHTML = `<div class="hint">Câu ${round+1}/${total}</div>
        <div style="text-align:center;font-size:2rem;font-weight:800;margin:20px 0">${a} ${op==='*'?'×':op==='/'?'÷':op} ${b} = ?</div>
        <input type="number" id="mathIn" placeholder="Đáp án" autocomplete="off">
        <div class="error-msg" id="mathErr">Sai!</div>`;
      const inp = body.querySelector('#mathIn'), err = body.querySelector('#mathErr');
      inp.focus();
      inp.oninput = () => {

    body.querySelector('#dc').onclick = done;
  };
}
function buildRandom(target) {
  return (body, done) => {
    let count = 0;
    body.innerHTML = `<div class="hint">Bấm random ${target} lần</div>
      <div style="text-align:center;font-size:3rem;margin:20px 0;font-weight:800;color:var(--accent)" id="rnd">0</div>
      <div class="tap-progress"><div class="tap-progress-fill" id="rbar"></div></div>
      <button class="btn btn-primary" id="rbtn" style="margin-top:14px">Random!</button>`;
    body.querySelector('#rbtn').onclick = () => {
      body.querySelector('#rnd').textContent = Math.floor(Math.random() * 100);
      count++;
      body.querySelector('#rbar').style.width = count/target*100+'%';
      if (count >= target) done();
    };
  };
}
function buildSwipe(dir) {
  return (body, done) => {
    let count = 0; const total = 10;
    body.innerHTML = `<div class="hint">Vuốt ${dir} ${total} lần</div>
      <div class="tap-area" id="swArea" style="height:220px">
        <div class="big" id="swCnt">0</div>
        <div class="sub">/ ${total}</div>
      </div>`;
    const area = body.querySelector('#swArea'), cnt = body.querySelector('#swCnt');
    let sx = 0, sy = 0;
    area.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    area.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      const ok = dir === 'up' ? dy < -50 : dir === 'down' ? dy > 50 : dir === 'left' ? dx < -50 : dx > 50;
      if (ok) { count++; cnt.textContent = count; if (count >= total) done(); }
    });
    area.addEventListener('mousedown', e => { sx = e.clientX; sy = e.clientY; });
    area.addEventListener('mouseup', e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const ok = dir === 'up' ? dy < -50 : dir === 'down' ? dy > 50 : dir === 'left' ? dx < -50 : dx > 50;
      if (ok) { count++; cnt.textContent = count; if (count >= total) done(); }
    });
  };
}
function buildFullscreen() {
  return (body, done) => {
    body.innerHTML = `<div class="hint">Bật chế độ toàn màn hình</div>
      <button class="btn btn-primary" id="fs">Bật Fullscreen</button>`;
    body.querySelector('#fs').onclick = async () => {
      try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch {}
      done();
    };
  };
}
function buildHover(target) {
  return (body, done) => {
    let count = 0;
    body.innerHTML = `<div class="hint">Hover ${target} ô</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">
        ${Array.from({ length: 20 }, (_, i) => `<div data-i="${i}" style="aspect-ratio:1;background:rgba(59,130,246,.15);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s"></div>`).join('')}
      </div>
      <div class="hint" style="text-align:center;margin-top:12px" id="hcnt">0 / ${target}</div>`;
    body.querySelectorAll('[data-i]').forEach(elx => {
      elx.addEventListener('mouseenter', () => {
        if (elx.dataset.done) return;
        elx.dataset.done = '1';
        elx.style.background = 'rgba(16,185,129,.4)';
        elx.style.borderColor = 'var(--success)';
        count++;
        body.querySelector('#hcnt').textContent = `${count} / ${target}`;
        if (count >= target) done();
      });
    });
  };
}
function buildScroll(dir) {
  return (body, done) => {
    body.innerHTML = `<div class="hint">Cuộn ${dir === 'top' ? 'lên đầu' : 'xuống cuối'}</div>
      <div style="height:400px;overflow-y:auto;background:rgba(5,11,26,.7);border-radius:12px;padding:20px;border:1px solid var(--border)" id="scrollBox">
        ${Array.from({ length: 40 }, (_, i) => `<div style="padding:16px;border-bottom:1px solid var(--border)">Dòng số ${i + 1}</div>`).join('')}
      </div>`;
    const box = body.querySelector('#scrollBox');
    let hasScrolled = false;
    const check = () => {
      const atTop = box.scrollTop <= 5;
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 5;
      if (dir === 'top' && atTop && hasScrolled) done();
      else if (dir === 'bottom' && atBottom) done();
      hasScrolled = true;
    };
    box.addEventListener('scroll', check);
    if (dir === 'top') NATIVE.setTimeout(() => { box.scrollTop = box.scrollHeight; }, 100);
  };
}

/* ============================================================
   ============ MUSIC + CONFETTI + FIREWORKS (v7.5 WOW) =====
   ============================================================ */
let musicCtx = null;
let musicPlaying = false;
let musicOsc = null;
let musicGain = null;
let musicInterval = null;

// Simple Vietnamese-inspired pentatonic melody using Web Audio (no external files needed)
const VN_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33]; // C D E G A C D
const VN_MELODY = [0,2,4,2,3,4,0,2,4,5,4,2,0,2,3,2,0]; // simple pattern

function initMusic() {
  if (musicCtx) return;
  try {
    musicCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { console.warn('Audio not supported'); }
}

function playVnNote(freq, dur = 0.35, startTime) {
  if (!musicCtx) return;
  const osc = musicCtx.createOscillator();
  const gain = musicCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.12, startTime + 0.04);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain);
  gain.connect(musicCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.05);
}

function startMusicLoop() {
  if (!musicCtx) initMusic();
  if (!musicCtx || musicPlaying) return;
  musicPlaying = true;
  const btn = $('musicBtn');
  if (btn) { btn.classList.add('playing'); btn.textContent = '🎶'; }
  let idx = 0;
  const playNext = () => {
    if (!musicPlaying) return;
    const now = musicCtx.currentTime;
    const note = VN_NOTES[VN_MELODY[idx % VN_MELODY.length]];
    playVnNote(note, 0.38, now);
    idx++;
    musicInterval = setTimeout(playNext, 420);
  };
  playNext();
}

function stopMusic() {
  musicPlaying = false;
  if (musicInterval) clearTimeout(musicInterval);
  const btn = $('musicBtn');
  if (btn) { btn.classList.remove('playing'); btn.textContent = '🎵'; }
}

function toggleMusic() {
  if (musicPlaying) stopMusic();
  else startMusicLoop();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && musicPlaying) stopMusic();
});

function launchConfetti() {
  const canvas = $('confettiCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = [];
  const colors = ['#ef4444','#fbbf24','#22d3ee','#a78bfa','#10b981','#f472b6','#ffffff'];
  for (let i = 0; i < 140; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 4,
      vx: -2 + Math.random() * 4,
      rot: Math.random() * 360,
      vr: -6 + Math.random() * 12,
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

function launchFireworks() {
  const container = $('fireworks');
  if (!container) return;
  const colors = ['#ef4444','#fbbf24','#22d3ee','#a78bfa','#f472b6','#10b981'];
  for (let burst = 0; burst < 5; burst++) {
    setTimeout(() => {
      const cx = 20 + Math.random() * 60;
      const cy = 20 + Math.random() * 40;
      for (let i = 0; i < 24; i++) {
        const angle = (i / 24) * Math.PI * 2;
        const dist = 40 + Math.random() * 80;
        const p = document.createElement('div');
        p.className = 'firework-particle';
        p.style.left = cx + '%';
        p.style.top = cy + '%';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.setProperty('--x', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--y', Math.sin(angle) * dist + 'px');
        p.style.boxShadow = `0 0 8px ${p.style.background}`;
        container.appendChild(p);
        setTimeout(() => p.remove(), 1300);
      }
    }, burst * 280);
  }
}
